<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ДК құрастыр — компьютер құрылысы туралы ойын</title>
  <meta name="description" content="5–7 сыныптарға арналған информатикадан оқу ойыны: компьютерді бөлшектерден құрастыр, құрылғыларды қос және жинағыңды тексер. Обучающая игра по информатике для 5–7 классов.">
  <meta name="theme-color" content="#DDE4E7">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/onest-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/unbounded-cyrillic-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#app">Ойынға өту</a>

  <header class="bar">
    <div class="container bar-inner">
      <a class="wordmark" href="#/" aria-label="ДК құрастыр, миссиялар тізіміне">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect x="1" y="1" width="30" height="30" rx="8" fill="var(--board)"/>
          <rect x="10" y="10" width="12" height="12" rx="1.5" fill="none" stroke="var(--gold)" stroke-width="2"/>
          <path d="M13 7v3M16 7v3M19 7v3M13 22v3M16 22v3M19 22v3M7 13h3M7 16h3M7 19h3M22 13h3M22 16h3M22 19h3" stroke="var(--silk)" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span id="brand-text">ДК құрастыр</span>
      </a>
      <nav class="bar-nav" aria-label="Бөлімдер">
        <a href="#/" data-nav="home">Миссиялар</a>
        <a href="#/results" data-nav="results">Менің нәтижелерім</a>
      </nav>
      <p class="rank" id="rank" aria-live="off"></p>
      <div class="lang" id="lang" role="group" aria-label="Тіл">
        <button type="button" data-lang="kk" lang="kk" aria-pressed="true">Қаз</button>
        <button type="button" data-lang="ru" lang="ru" aria-pressed="false">Рус</button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <noscript>
      <div class="container noscript">
        <h1>Компьютерді өзің құрастыр</h1>
        <p>Ойынға JavaScript керек. Оны браузер баптауларында қосып, бетті жаңарт.</p>
        <p lang="ru">Игре нужен JavaScript. Включи его в настройках браузера и обнови страницу.</p>
      </div>
    </noscript>
  </main>

  <p class="visually-hidden" id="announcer" role="status" aria-live="polite"></p>

  <dialog id="post" aria-labelledby="post-title">
    <div class="bios">
      <p class="bios-head" id="post-title"></p>
      <ol class="bios-lines" id="post-lines"></ol>
    </div>
    <div class="verdict" id="post-verdict"></div>
  </dialog>

  <footer class="foot">
    <div class="container foot-inner">
      <p id="foot-1">ДК құрастыр. 5–7 сыныптарда информатика сабағына арналған ойын.</p>
      <p id="foot-2">Бөлшектердің бағасы мен сипаттамалары оқу мақсатында берілген, дүкендегіден өзгеше болуы мүмкін.</p>
    </div>
  </footer>

  <script src="game.js" defer></script>
</body>
</html>
